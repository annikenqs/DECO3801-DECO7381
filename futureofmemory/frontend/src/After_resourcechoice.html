<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Draft — 2075</title>
  <style>
    html, body { height: 100%; }
    body{
      margin: 0;
      font-family: 'Courier New', monospace;
      color: #fff;
      background: #0b1020; 
      display: grid;
      place-items: center;
    }
    .box{ text-align: center; padding: 24px; }
    .msg{
      margin: 0 0 1rem;
      font-size: clamp(20px, 3vw, 32px);
      line-height: 1.5;
    }
    .btn{
      display: inline-block;
      padding: 10px 16px;
      border: 1px solid #ffffff80;
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      transition: transform .15s ease, background .2s ease, border-color .2s ease;
    }
    .btn:hover{ transform: translateY(-2px); background: #ffffff14; border-color: #fff; }
    .btn:focus-visible{ outline: 3px solid #8ab4f8; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="box">
    <h1 class="msg">Memory as a resource introduction video(or texts) is in production...</h1>
    <a class="btn" href="resourceists.html">Scenario2</a>
  </main>
</body>
</html>
