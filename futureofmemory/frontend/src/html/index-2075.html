<!-- Introductory video page for the Future of Memory simulation. lays the 2075 world introduction video with replay, skip, and sound controls. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World 2075</title>
    <link rel="stylesheet" href="../css/index-2075.css" />
  </head>
  <body>
    <main class="video-wrap" role="region" aria-label="World 2075 intro video">
      <!-- Autoplay requires muted + playsinline -->
      <video
        id="introVideo"
        class="video"
        src="../media/World2075.mp4"
        autoplay
        muted
        playsinline
        preload="auto"
      >
        Your browser does not support HTML5 video.
      </video>

      <!-- Controls overlay -->
      <div class="controls">
        <button id="replayBtn" class="btn btn-left" type="button">⟲ Replay</button>

        <!-- Anchor fallback (skip) -->
        <a id="skipLink" class="btn btn-right" href="./scenario1.html">Skip →</a>

        <!-- Unmute button -->
        <button id="unmuteBtn" class="btn btn-center" type="button">🔊 Turn on sound</button>
      </div>
    </main>

    <script src="../js/index-2075.js"></script>
  </body>
</html>
