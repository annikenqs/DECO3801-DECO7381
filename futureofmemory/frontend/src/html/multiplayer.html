<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multiplayer - Memory Futures</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/multiplayer.css">
</head>
<body>
  <div class="scene">
    <canvas id="snowCanvas"></canvas>

    <div class="menu">
      <h1 class="title">MEMORY FUTURES</h1>

      <div class="multiplayer-container">
        <!-- Start new game -->

        <!-- Join existing game -->
        <div class="join-box">
            <button class="btn" id="new-game-btn">START NEW MULTIPLAYER GAME</button>
          <button class="btn" id="join-btn">JOIN GAME</button>
          <input type="text" id="game-pin" placeholder="Enter Game PIN">
          <input type="text" id="nickname" placeholder="Enter Nickname">
        </div>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/multiplayer.js"></script>
</body>
</html>
